<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chill Letter | Reset Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-cream: #F8F5EE;
            --color-olive: #5F7053;
            --color-sage: #9AB29A;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--color-cream);
            background-image: url("https://www.transparenttextures.com/patterns/natural-paper.png");
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .serif { font-family: 'Playfair Display', serif; }
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px 0 rgba(95, 112, 83, 0.1);
        }
        .btn-olive {
            background-color: var(--color-olive);
            color: white;
            transition: all 0.3s ease;
        }
        .btn-olive:hover {
            background-color: #4A5841;
            transform: translateY(-1px);
        }
        .hidden { display: none; }
        .loading-spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid #fff;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-4">
    <div id="app" class="max-w-md w-full">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="serif text-4xl mb-2 text-[#4A4B46]">Chill Letter</h1>
            <p class="text-gray-500 text-sm tracking-widest uppercase">Password Recovery</p>
        </div>

        <!-- Reset Password Card -->
        <div id="reset-card" class="glass rounded-3xl p-8 animate-fade-in">
            <h2 class="serif text-2xl mb-6 text-center text-[#4A4B46]">Set New Password</h2>
            
            <p id="auth-status" class="text-sm text-gray-500 text-center mb-6">Checking secure link...</p>

            <form id="reset-form" class="hidden">
                <div class="mb-6">
                    <input type="password" id="new-password" placeholder="New Password (min 6 chars)" required minlength="6"
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#5F7053] bg-white/50">
                </div>
                <button type="submit" id="submit-btn" class="w-full btn-olive py-4 rounded-xl font-bold tracking-widest text-xs uppercase">
                    Update Password
                </button>
            </form>
            <p id="error-msg" class="text-red-500 text-xs mt-4 text-center hidden"></p>
        </div>

        <!-- Success State -->
        <div id="success-card" class="glass rounded-3xl p-10 text-center animate-fade-in hidden">
            <div class="w-20 h-20 bg-[#9AB29A] rounded-full mx-auto mb-6 flex items-center justify-center text-white text-3xl">✓</div>
            <h2 class="serif text-2xl mb-4 text-[#4A4B46]">Password Updated</h2>
            <p class="text-gray-600 leading-relaxed mb-8 text-sm">
                Your password has been reset successfully. You can now log in with your new password.
            </p>
            <a href="delete-account.html" class="inline-block w-full btn-olive py-4 rounded-xl font-bold tracking-widest text-xs uppercase text-center">
                Return to Login
            </a>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        const SUPABASE_URL = 'https://uqcvyifjdvimbfwbawha.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_hPRhDt4UOkWIAqzIhP_D_w_iPeWbH9X';
        
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const resetCard = document.getElementById('reset-card');
        const successCard = document.getElementById('success-card');
        const resetForm = document.getElementById('reset-form');
        const authStatus = document.getElementById('auth-status');
        const errorMsg = document.getElementById('error-msg');
        const submitBtn = document.getElementById('submit-btn');

        async function initAuth() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');

            if (code) {
                // PKCE flow: we have a code in the URL that needs to be exchanged
                const { error } = await _supabase.auth.exchangeCodeForSession(code);
                if (error) {
                    console.error("Error exchanging code:", error.message);
                }
                // Clear the code from the URL so it doesn't get reused
                window.history.replaceState({}, document.title, window.location.pathname);
            }

            const { data: { session }, error } = await _supabase.auth.getSession();
            if (session) {
                authStatus.classList.add('hidden');
                resetForm.classList.remove('hidden');
            } else {
                authStatus.innerText = "Invalid or expired recovery link.";
                authStatus.classList.replace('text-gray-500', 'text-red-500');
            }
        }

        // Supabase will parse the URL fragments on load and trigger auth state change
        _supabase.auth.onAuthStateChange((event, session) => {
            console.log("Auth event:", event);
            if (event === 'PASSWORD_RECOVERY' || session) {
                authStatus.classList.add('hidden');
                resetForm.classList.remove('hidden');
            }
        });

        initAuth();

        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('new-password').value;
            
            submitBtn.innerHTML = '<div class="loading-spinner mx-auto"></div>';
            submitBtn.disabled = true;
            errorMsg.classList.add('hidden');

            const { data, error } = await _supabase.auth.updateUser({
                password: newPassword
            });

            if (error) {
                errorMsg.innerText = error.message;
                errorMsg.classList.remove('hidden');
                submitBtn.innerHTML = 'Update Password';
                submitBtn.disabled = false;
            } else {
                resetCard.classList.add('hidden');
                successCard.classList.remove('hidden');
                // Optional: sign out immediately so they have to sign in again
                await _supabase.auth.signOut();
            }
        });
    </script>
</body>
</html>
